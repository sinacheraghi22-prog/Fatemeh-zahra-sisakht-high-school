<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}دبیرستان فاطمه زهرا{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary: #1E3A8A;
            --primary-dark: #0F172A;
            --bg-light: #F8FAFC;
            --text-dark: #334155;
            --border: #E2E8F0;
        }
        * { font-family: Tahoma, sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); }
        .navbar { background-color: var(--primary); padding: 1rem 0; }
        .navbar-brand { color: white !important; font-weight: 700; font-size: 1.3rem; }
        .navbar .nav-link { color: rgba(255,255,255,0.85) !important; padding: 0.5rem 1rem !important; }
        .navbar .nav-link:hover { color: white !important; }
        .card { border: 1px solid var(--border); border-radius: 12px; }
        .btn-primary { background-color: var(--primary); border-color: var(--primary); }
        footer { background-color: var(--primary-dark); color: rgba(255,255,255,0.8); padding: 2rem 0; margin-top: 4rem; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-mortarboard-fill"></i> دبیرستان فاطمه زهرا
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">صفحه اصلی</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/">پنل مدیریت</a></li>
		<li class="nav-item"><a class="nav-link" href="{% url 'announcements:list' %}">اطلاعیه‌>
		<li class="nav-item"><a class="nav-link" href="{% url 'activities:list' %}">فعالیت‌ها</a></li>
            </ul>
        </div>
    </div>
</nav>

<main>
    {% block content %}{% endblock %}
</main>

<footer>
    <div class="container text-center">
        <p class="mb-0">© ۱۴۰۳ دبیرستان فاطمه زهرا</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
