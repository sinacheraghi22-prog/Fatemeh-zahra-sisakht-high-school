{% extends 'base.html' %}

{% block title %}صفحه اصلی - دبیرستان فاطمه زهرا{% endblock %}

{% block content %}

<section class="py-5" style="background: linear-gradient(135deg, #1E3A8A 0%, #0F172A 100%); color: white;">
    <div class="container py-4 text-center">
        <h1 class="display-5 fw-bold mb-3">به دبیرستان فاطمه زهرا خوش آمدید</h1>
        <p class="lead mb-0">محیطی امن، پویا و علمی برای پرورش نسل آینده‌سازان ایران</p>
    </div>
</section>

<section class="py-5">
    <div class="container">
        <div class="row g-4">
            <div class="col-md-3 col-6">
                <div class="card text-center p-4">
                    <i class="bi bi-people-fill" style="font-size: 2.5rem; color: var(--primary);"></i>
                    <h3 class="mt-3 mb-1">۵۰۰+</h3>
                    <p class="text-muted mb-0 small">دانش‌آموز</p>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="card text-center p-4">
                    <i class="bi bi-person-badge" style="font-size: 2.5rem; color: var(--primary);"></i>
                    <h3 class="mt-3 mb-1">۴۰+</h3>
                    <p class="text-muted mb-0 small">دبیر مجرب</p>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="card text-center p-4">
                    <i class="bi bi-book" style="font-size: 2.5rem; color: var(--primary);"></i>
                    <h3 class="mt-3 mb-1">۳</h3>
                    <p class="text-muted mb-0 small">رشته تحصیلی</p>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="card text-center p-4">
                    <i class="bi bi-trophy" style="font-size: 2.5rem; color: var(--primary);"></i>
                    <h3 class="mt-3 mb-1">۱۰۰+</h3>
                    <p class="text-muted mb-0 small">افتخارآفرینی</p>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
